<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Customer | TradeFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .warning {
            padding: 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .button {
            border: 0;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            background: #111827;
            color: white;
        }

        .button.danger {
            background: #dc2626;
        }

        .button.secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <h1>
            Delete Customer
        </h1>

        <p>
            You are about to delete:
        </p>

        <div class="warning">
            <strong>
                {{ customer.name }}
            </strong>

            {% if customer.phone %}
                <br>
                {{ customer.phone }}
            {% endif %}
        </div>

        <p>
            This action cannot be undone.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="actions">

                <button
                    type="submit"
                    class="button danger"
                >
                    Yes, Delete Customer
                </button>

                <a
                    href="{% url 'core:customer_list' %}"
                    class="button secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
