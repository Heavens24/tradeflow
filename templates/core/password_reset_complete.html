<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Changed | TradeFlow</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 34px;
            border-radius: 16px;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .button {
            display: block;
            margin-top: 22px;
            padding: 14px;
            border-radius: 9px;
            background: #111827;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>
        Password changed
    </h1>

    <p>
        Your TradeFlow password has been updated
        successfully. You can now clock in using your
        new password.
    </p>

    <a
        href="{% url 'core:login' %}"
        class="button"
    >
        Clock In
    </a>

</div>

</body>

</html>
