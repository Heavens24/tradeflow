<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Payment | TradeFlow</title>
</head>

<body>

<h1>
    Delete Payment
</h1>

<p>
    Invoice:
    {{ invoice.invoice_number }}
</p>

<p>
    Amount:
    R{{ payment.amount|floatformat:2 }}
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete Payment
    </button>

    <a href="{% url 'core:invoice_detail' invoice.id %}">
        Cancel
    </a>

</form>

</body>

</html>
