<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Quote | TradeFlow</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: white;
            padding: 32px;
            border-radius: 14px;
        }

        .warning {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .button {
            border: 0;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

    </style>

</head>

<body>

<div class="page">

    <div class="card">

        <h1>
            Delete Quote
        </h1>

        <p>
            Are you sure you want to delete this quote?
        </p>

        <div class="warning">

            <strong>
                {{ quote.quote_number }}
            </strong>

            <br>

            {{ quote.customer.name }}

            <br>

            Total:
            R{{ quote.total|floatformat:2 }}

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="actions">

                <button
                    type="submit"
                    class="button danger"
                >
                    Yes, Delete Quote
                </button>

                <a
                    href="{% url 'core:quote_detail' quote.id %}"
                    class="button secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
