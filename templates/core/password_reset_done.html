<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Email Sent | TradeFlow</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 34px;
            border-radius: 16px;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>
        Check your email
    </h1>

    <p>
        If an active TradeFlow account exists for the
        email address you entered, we've sent password
        reset instructions.
    </p>

    <p>
        During local development, the reset message is
        printed in the VS Code terminal.
    </p>

    <a href="{% url 'core:login' %}">
        ← Return to Clock In
    </a>

</div>

</body>

</html>
