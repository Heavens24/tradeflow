<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Job | TradeFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 32px;
            border-radius: 14px;
        }

        .warning {
            padding: 15px;
            margin: 20px 0;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 8px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .button {
            border: 0;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <h1>
            Delete Job
        </h1>

        <p>
            Are you sure you want to delete this job?
        </p>

        <div class="warning">

            <strong>
                {{ job.job_number }}
            </strong>

            <br>

            {{ job.title }}

            <br>

            Customer:
            {{ job.customer.name }}

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="actions">

                <button
                    type="submit"
                    class="button danger"
                >
                    Yes, Delete Job
                </button>

                <a
                    href="{% url 'core:job_detail' job.id %}"
                    class="button secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
