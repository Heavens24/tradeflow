<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Record Payment | TradeFlow</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page {
            padding: 40px 20px;
        }

        .card {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .error {
            margin-top: 6px;
            padding: 8px;
            color: #991b1b;
            background: #fef2f2;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 8px;
            background: #111827;
            color: white;
            border: 0;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <a
            href="{% url 'core:invoice_detail' invoice.id %}"
        >
            ← {{ invoice.invoice_number }}
        </a>

        <h1>
            Record Payment
        </h1>

        <p>
            Customer:
            <strong>
                {{ invoice.customer.name }}
            </strong>
        </p>

        <p>
            Outstanding:
            <strong>
                R{{ invoice.balance_due|floatformat:2 }}
            </strong>
        </p>


        <form method="POST">

            {% csrf_token %}

            {% for field in form %}

                <div class="field">

                    <label>
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="error">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}


            <button
                type="submit"
                class="button"
            >
                Record Payment
            </button>

        </form>

    </div>

</div>

</body>

</html>
